<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sourdough">
<title>Sourdough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F5F0E8;
    --warm: #E8DFC8;
    --crust: #C4A882;
    --dark: #2C1810;
    --mid: #6B4C35;
    --accent: #D4622A;
    --accent-light: #E8845A;
    --green: #4A7C59;
    --safe: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    background: var(--dark);
    color: var(--cream);
    font-family: 'DM Mono', monospace;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 0;
    position: relative;
    overflow: hidden;
  }

  /* Grain texture overlay */
  .app::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.6;
  }

  /* Header */
  .header {
    padding: 56px 28px 16px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--crust);
    letter-spacing: 0.02em;
  }

  .header .date {
    font-size: 11px;
    color: var(--mid);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Main stage */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 28px;
    gap: 0;
  }

  /* Step indicator */
  .step-track {
    display: flex;
    gap: 8px;
    margin-bottom: 40px;
  }

  .step-pip {
    width: 28px;
    height: 3px;
    border-radius: 2px;
    background: var(--mid);
    transition: background 0.4s ease, width 0.4s ease;
  }

  .step-pip.done { background: var(--crust); }
  .step-pip.active { background: var(--accent); width: 44px; }

  /* Phase label */
  .phase-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    height: 16px;
    transition: opacity 0.3s;
  }

  /* Timer ring */
  .ring-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    margin-bottom: 32px;
  }

  .ring-svg {
    width: 220px;
    height: 220px;
    transform: rotate(-90deg);
  }

  .ring-track {
    fill: none;
    stroke: var(--mid);
    stroke-width: 3;
    opacity: 0.3;
  }

  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .time-display {
    font-family: 'DM Serif Display', serif;
    font-size: 62px;
    color: var(--cream);
    line-height: 1;
    letter-spacing: -0.02em;
    transition: color 0.4s;
  }

  .time-display.urgent { color: var(--accent-light); }
  .time-display.done-color { color: var(--green); }

  .time-sub {
    font-size: 11px;
    color: var(--mid);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Step description */
  .step-desc {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--warm);
    text-align: center;
    margin-bottom: 8px;
    min-height: 28px;
    transition: opacity 0.3s;
  }

  .step-hint {
    font-size: 11px;
    color: var(--mid);
    text-align: center;
    letter-spacing: 0.05em;
    min-height: 16px;
  }

  /* Buttons */
  .btn-area {
    padding: 20px 28px calc(28px + var(--safe));
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.1s;
  }

  .btn:active { transform: scale(0.98); opacity: 0.85; }

  .btn-primary {
    background: var(--accent);
    color: var(--cream);
  }

  .btn-secondary {
    background: transparent;
    color: var(--mid);
    border: 1px solid var(--mid);
  }

  .btn-green {
    background: var(--green);
    color: var(--cream);
  }

  .btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  /* Notif banner */
  .notif-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: var(--accent);
    color: var(--cream);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-align: center;
    padding: 10px 16px;
    z-index: 200;
    transform: translateY(-100%);
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }

  .notif-bar.show { transform: translateY(0); }

  /* Overlay for fold-done state */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(44,24,16,0.92);
    z-index: 150;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 40px 28px calc(40px + var(--safe));
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .overlay-title {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    color: var(--cream);
    text-align: center;
  }

  .overlay-sub {
    font-size: 13px;
    color: var(--mid);
    text-align: center;
    letter-spacing: 0.06em;
    line-height: 1.6;
  }

  .overlay .btn { max-width: 320px; width: 100%; }

  /* Permission notice */
  .perm-notice {
    font-size: 11px;
    color: var(--mid);
    text-align: center;
    padding: 0 28px 12px;
    line-height: 1.5;
    letter-spacing: 0.03em;
  }

  /* Complete screen */
  .complete-icon {
    font-size: 48px;
    margin-bottom: 8px;
  }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.04); opacity: 1; }
    100% { transform: scale(1); opacity: 0.6; }
  }

  .ring-wrap.ticking .ring-progress {
    animation: none;
  }

  .ring-wrap.alarm-pulse {
    animation: pulse-ring 0.8s ease-in-out infinite;
  }
</style>
</head>
<body>

<div class="notif-bar" id="notifBar">🌾 Timer complete</div>

<div class="app">
  <div class="header">
    <h1>Sourdough</h1>
    <span class="date" id="headerDate"></span>
  </div>

  <div class="stage">
    <div class="step-track" id="stepTrack"></div>
    <div class="phase-label" id="phaseLabel">Ready to begin</div>
    <div class="ring-wrap" id="ringWrap">
      <svg class="ring-svg" viewBox="0 0 220 220">
        <circle class="ring-track" cx="110" cy="110" r="98"/>
        <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="98"
          stroke-dasharray="615.75"
          stroke-dashoffset="0"/>
      </svg>
      <div class="ring-center">
        <div class="time-display" id="timeDisplay">—</div>
        <div class="time-sub" id="timeSub">tap start to begin</div>
      </div>
    </div>
    <div class="step-desc" id="stepDesc">Mix your dough</div>
    <div class="step-hint" id="stepHint">then tap start below</div>
  </div>

  <div class="perm-notice" id="permNotice"></div>

  <div class="btn-area" id="btnArea">
    <button class="btn btn-primary" id="mainBtn" onclick="handleMain()">Start bake</button>
    <button class="btn btn-secondary" id="secBtn" onclick="handleSecondary()" style="display:none">Reset</button>
  </div>
</div>

<!-- Fold-ready overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-title" id="overlayTitle">Time to fold</div>
  <div class="overlay-sub" id="overlaySub"></div>
  <button class="btn btn-green" onclick="confirmFold()">Done — start next timer</button>
  <button class="btn btn-secondary" onclick="snooze()">+5 minutes</button>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  const FOLD_COUNT = 4;
  const INTERVAL_MS = 30 * 60 * 1000; // 30 min
  const CIRCUMFERENCE = 615.75;

  let state = {
    running: false,
    mixTime: null,       // timestamp ms
    foldsDone: 0,        // 0–4
    timerEnd: null,      // timestamp ms when current timer ends
    tickInterval: null,
    notifPermission: 'default',
    scheduledNotifs: [],
    snoozed: false,
  };

  // ── Persistence ────────────────────────────────────────────────────────────
  function saveState() {
    localStorage.setItem('sd_state', JSON.stringify({
      running: state.running,
      mixTime: state.mixTime,
      foldsDone: state.foldsDone,
      timerEnd: state.timerEnd,
    }));
  }

  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem('sd_state') || 'null');
      if (s && s.running) {
        state.running = s.running;
        state.mixTime = s.mixTime;
        state.foldsDone = s.foldsDone;
        state.timerEnd = s.timerEnd;
        return true;
      }
    } catch(e) {}
    return false;
  }

  function clearState() {
    localStorage.removeItem('sd_state');
    state.running = false;
    state.mixTime = null;
    state.foldsDone = 0;
    state.timerEnd = null;
    state.snoozed = false;
  }

  // ── Notifications ──────────────────────────────────────────────────────────
  async function requestNotifPermission() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') {
      state.notifPermission = 'granted';
      return;
    }
    const result = await Notification.requestPermission();
    state.notifPermission = result;
    updatePermNotice();
  }

  function scheduleNotif(title, body, delayMs) {
    if (state.notifPermission !== 'granted') return;
    const id = setTimeout(() => {
      new Notification(title, { body, icon: '', silent: false });
    }, delayMs);
    state.scheduledNotifs.push(id);
  }

  function clearAllNotifs() {
    state.scheduledNotifs.forEach(id => clearTimeout(id));
    state.scheduledNotifs = [];
  }

  function updatePermNotice() {
    const el = document.getElementById('permNotice');
    if (!('Notification' in window)) {
      el.textContent = 'Add to home screen for push notifications.';
    } else if (Notification.permission === 'denied') {
      el.textContent = 'Notifications blocked — enable in Settings → Safari → Notifications.';
    } else if (Notification.permission === 'default') {
      el.textContent = '';
    } else {
      el.textContent = '';
    }
  }

  // ── Timer logic ────────────────────────────────────────────────────────────
  function targetTimeForFold(foldNumber) {
    // foldNumber 1–4; rest before fold 1 = 30min, before fold 2 = 60min etc.
    return state.mixTime + foldNumber * INTERVAL_MS;
  }

  function startTimer(endTimestamp) {
    state.timerEnd = endTimestamp;
    saveState();
    if (state.tickInterval) clearInterval(state.tickInterval);
    state.tickInterval = setInterval(tick, 500);
    tick();
  }

  function tick() {
    const now = Date.now();
    const remaining = state.timerEnd - now;

    if (remaining <= 0) {
      clearInterval(state.tickInterval);
      onTimerComplete();
      return;
    }

    const totalDuration = INTERVAL_MS;
    const elapsed = totalDuration - remaining;
    const progress = Math.max(0, Math.min(1, elapsed / totalDuration));

    updateRing(progress, remaining);
  }

  function onTimerComplete() {
    updateRing(1, 0);
    document.getElementById('ringWrap').classList.add('alarm-pulse');

    const nextFold = state.foldsDone + 1;

    if (nextFold <= FOLD_COUNT) {
      showOverlay(nextFold);
      showNotifBanner(`Time for stretch & fold ${nextFold} of ${FOLD_COUNT}`);
      playBeep();
    } else {
      // All done
      showComplete();
    }
  }

  // ── UI Updates ─────────────────────────────────────────────────────────────
  function updateRing(progress, remainingMs) {
    const offset = CIRCUMFERENCE * (1 - progress);
    document.getElementById('ringProgress').style.strokeDashoffset = offset;

    const secs = Math.max(0, Math.ceil(remainingMs / 1000));
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    const display = secs > 0
      ? `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
      : '00:00';

    const td = document.getElementById('timeDisplay');
    td.textContent = display;
    td.className = 'time-display' + (secs <= 60 && secs > 0 ? ' urgent' : '') + (secs === 0 ? ' done-color' : '');
  }

  function renderStepTrack() {
    const track = document.getElementById('stepTrack');
    // Steps: rest, fold1, fold2, fold3, fold4
    const total = 5;
    const currentStep = state.foldsDone + 1; // 1 = rest, 2 = fold1, etc.
    track.innerHTML = '';
    for (let i = 1; i <= total; i++) {
      const pip = document.createElement('div');
      pip.className = 'step-pip' + (i < currentStep ? ' done' : i === currentStep ? ' active' : '');
      track.appendChild(pip);
    }
  }

  function renderPhase() {
    const labels = ['30 min rest', 'fold 1 of 4', 'fold 2 of 4', 'fold 3 of 4', 'fold 4 of 4'];
    const descs = [
      'resting after mix',
      'stretch & fold 2 next',
      'stretch & fold 3 next',
      'stretch & fold 4 next',
      'last fold — bulk ferment after',
    ];
    const hints = [
      'timer running — check back when it ends',
      'timer running',
      'timer running',
      'timer running',
      'timer running',
    ];
    const i = state.foldsDone;
    document.getElementById('phaseLabel').textContent = labels[i] || '';
    document.getElementById('stepDesc').textContent = descs[i] || '';
    document.getElementById('stepHint').textContent = hints[i] || '';
  }

  function showOverlay(foldNum) {
    document.getElementById('overlayTitle').textContent = `Fold ${foldNum} of ${FOLD_COUNT}`;
    document.getElementById('overlaySub').textContent =
      `Perform your stretch & fold,\nthen tap done to start the next timer.`;
    document.getElementById('overlay').classList.add('show');
    document.getElementById('ringWrap').classList.remove('alarm-pulse');
  }

  function hideOverlay() {
    document.getElementById('overlay').classList.remove('show');
  }

  function showNotifBanner(msg) {
    const bar = document.getElementById('notifBar');
    bar.textContent = '🌾 ' + msg;
    bar.classList.add('show');
    setTimeout(() => bar.classList.remove('show'), 4000);
  }

  function showComplete() {
    hideOverlay();
    document.getElementById('phaseLabel').textContent = 'Complete';
    document.getElementById('stepDesc').textContent = 'All 4 folds done';
    document.getElementById('stepHint').textContent = 'shape your loaf when ready';
    document.getElementById('timeDisplay').textContent = '✓';
    document.getElementById('timeDisplay').className = 'time-display done-color';
    document.getElementById('timeSub').textContent = 'bulk ferment ready';
    document.getElementById('ringProgress').style.stroke = 'var(--green)';
    document.getElementById('mainBtn').style.display = 'none';
    document.getElementById('secBtn').style.display = 'block';
    document.getElementById('secBtn').textContent = 'Start new bake';
    document.getElementById('secBtn').className = 'btn btn-secondary';
    showNotifBanner('All folds complete — shape your loaf!');
    playBeep();
    clearState();
  }

  // ── Actions ────────────────────────────────────────────────────────────────
  function handleMain() {
    if (!state.running) {
      startBake();
    }
  }

  function handleSecondary() {
    resetBake();
  }

  function startBake() {
    state.running = true;
    state.mixTime = Date.now();
    state.foldsDone = 0;

    // Schedule all 4 fold notifications
    for (let i = 1; i <= FOLD_COUNT; i++) {
      const delay = i * INTERVAL_MS - (Date.now() - state.mixTime);
      scheduleNotif(
        `Fold ${i} of ${FOLD_COUNT} ready`,
        'Time for your stretch & fold — open Sourdough.',
        delay
      );
    }

    saveState();
    renderStepTrack();
    renderPhase();

    document.getElementById('mainBtn').textContent = 'Running…';
    document.getElementById('mainBtn').disabled = true;
    document.getElementById('secBtn').style.display = 'block';
    document.getElementById('timeSub').textContent = 'remaining';

    startTimer(targetTimeForFold(1));
  }

  function confirmFold() {
    hideOverlay();
    state.foldsDone += 1;

    if (state.foldsDone >= FOLD_COUNT) {
      showComplete();
      return;
    }

    saveState();
    renderStepTrack();
    renderPhase();

    // Next target: anchor to mix time
    const nextTarget = targetTimeForFold(state.foldsDone + 1);
    startTimer(nextTarget);
  }

  function snooze() {
    hideOverlay();
    // Add 5 min snooze — but still anchor to mix time for the real timer
    // Just delay the overlay reprompt
    state.snoozed = true;
    setTimeout(() => {
      const nextFold = state.foldsDone + 1;
      if (nextFold <= FOLD_COUNT) showOverlay(nextFold);
    }, 5 * 60 * 1000);

    showNotifBanner('+5 min — come back soon');
  }

  function resetBake() {
    clearInterval(state.tickInterval);
    clearAllNotifs();
    clearState();

    document.getElementById('ringProgress').style.strokeDashoffset = '0';
    document.getElementById('ringProgress').style.stroke = 'var(--accent)';
    document.getElementById('ringWrap').classList.remove('alarm-pulse');
    document.getElementById('timeDisplay').textContent = '—';
    document.getElementById('timeDisplay').className = 'time-display';
    document.getElementById('timeSub').textContent = 'tap start to begin';
    document.getElementById('phaseLabel').textContent = 'Ready to begin';
    document.getElementById('stepDesc').textContent = 'Mix your dough';
    document.getElementById('stepHint').textContent = 'then tap start below';
    document.getElementById('mainBtn').textContent = 'Start bake';
    document.getElementById('mainBtn').disabled = false;
    document.getElementById('mainBtn').style.display = 'block';
    document.getElementById('secBtn').style.display = 'none';
    hideOverlay();

    const track = document.getElementById('stepTrack');
    track.innerHTML = '';
    for (let i = 0; i < 5; i++) {
      const pip = document.createElement('div');
      pip.className = 'step-pip';
      track.appendChild(pip);
    }
  }

  // ── Audio beep ─────────────────────────────────────────────────────────────
  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.2, 0.4].forEach(delay => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0, ctx.currentTime + delay);
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + delay + 0.05);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + delay + 0.3);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + 0.35);
      });
    } catch(e) {}
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  function init() {
    // Date header
    const now = new Date();
    document.getElementById('headerDate').textContent =
      now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

    // Empty step track
    const track = document.getElementById('stepTrack');
    for (let i = 0; i < 5; i++) {
      const pip = document.createElement('div');
      pip.className = 'step-pip';
      track.appendChild(pip);
    }

    // Request notifications
    requestNotifPermission();
    updatePermNotice();

    // Resume if mid-bake
    if (loadState()) {
      renderStepTrack();
      renderPhase();
      document.getElementById('mainBtn').textContent = 'Running…';
      document.getElementById('mainBtn').disabled = true;
      document.getElementById('secBtn').style.display = 'block';
      document.getElementById('timeSub').textContent = 'remaining';

      // Check if timer already expired
      if (state.timerEnd && Date.now() >= state.timerEnd) {
        onTimerComplete();
      } else if (state.timerEnd) {
        startTimer(state.timerEnd);
      }
    }
  }

  window.addEventListener('load', init);
</script>
</body>
</html>
